name: respirabox_mobile
description: Application mobile RespiraBox pour le dépistage des maladies respiratoires en Côte d'Ivoire
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations:
    sdk: flutter
  
  # 🔥 Firebase (Backend) - Versions mises à jour pour Web
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  # firebase_storage: ^12.3.2  # Désactivé - nécessite mode Blaze
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1
  
  # 🧠 State Management (Riverpod)
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # 🧭 Navigation
  go_router: ^12.1.3
  
  # 🎨 UI/UX
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  flutter_animate: ^4.5.0
  
  # 📶 Bluetooth/Wi-Fi
  flutter_blue_plus: ^1.14.4
  wifi_iot: ^0.3.18
  
  # 🌐 HTTP & API (Gemini AI)
  http: ^1.1.2
  dio: ^5.4.0
  google_generative_ai: ^0.4.0
  
  # 🌍 Géolocalisation pour API météo
  geolocator: ^10.1.0
  
  # 📊 Charts & Graphiques
  fl_chart: ^0.65.0
  # syncfusion_flutter_charts: ^24.1.41 # Temporairement désactivé - conflit avec intl
  
  # 📄 PDF Export
  pdf: ^3.10.7
  printing: ^5.11.1
  
  # � Image Picker
  image_picker: ^1.0.7
    # 📤 Share
  share_plus: ^7.2.1
  
  # 🔐 Permissions
  permission_handler: ^11.1.0
  
  # 🎤 Audio Recording (flutter_sound - alternative stable)
  flutter_sound: ^9.2.13
  
  # 🎵 Audio Analysis (FFT, MFCC, Spectral features)
  fftea: ^1.0.0
  scidart: ^0.0.2-dev.7

  # 🤖 Modèle ML embarqué (détecteur crackles/sibilants entraîné sur ICBHI 2017)
  tflite_flutter: ^0.12.1

  # 🔊 Synthèse vocale (réponses parlées du chatbot)
  flutter_tts: ^4.2.0

  # 🗺️ Ouverture d'itinéraire vers un centre de santé (Google/Apple Maps)
  url_launcher: ^6.3.1
  
  #  Storage
  firebase_storage: ^12.4.10

  # 🔒 Pseudonymisation des identifiants (partage recherche)
  crypto: ^3.0.3

  # 📰 Parsing du flux RSS éducation santé (synchronisation côté app)
  xml: ^6.5.0
  
  # �🛠️ Utilitaires
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  uuid: ^4.2.2
  equatable: ^2.0.5
  flutter_dotenv: ^5.1.0

# dependency_overrides supprimés - migration vers flutter_sound
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  
  # 🖼️ Assets (images, icônes, animations)
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/models/
    - .env
